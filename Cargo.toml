[package]
name = "lumierre"
version = "0.1.0"
edition = "2024"

[lib]
name = "winmm"
crate-type = ["cdylib"]

[[bin]]
name = "keygen"
path = "src/main.rs"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
serde_json = "1"
flate2 = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
